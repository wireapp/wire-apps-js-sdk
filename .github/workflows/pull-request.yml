name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      
      - name: Typescript Build Setup
        run: npm run build:setup

      - name: TypeScript Build
        run: npm run build

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build/
            eslint-report/
            coverage/
